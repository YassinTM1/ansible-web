- name: Maak de ansible beheerdersgebruiker aan
  ansible.builtin.user:
    name: ansible
    state: present
    shell: /bin/bash
    create_home: true

- name: Zorg voor sudoers configuratie zonder wachtwoord voor ansible
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible
    content: "ansible ALL=(ALL) NOPASSWD: ALL"
    mode: '0440'

- name: Voeg de SSH public key toe voor de ansible gebruiker
  ansible.posix.authorized_key:
    user: ansible
    state: present
    key: "{{ lookup('file', '~/.ssh/ansible.pub') }}"
